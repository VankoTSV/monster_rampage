<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#10151c">
  <title>Monster Rampage</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10151c; }
    body { display: grid; place-items: center; font-family: Arial, sans-serif; }
    canvas { display: block; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); outline: none; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Monster Rampage game"></canvas>
  <script src="game.js"></script>
</body>
</html>
